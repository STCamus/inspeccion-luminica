<style>
/* Layout: una columna de terreno, cabecera fija con navegación por módulos; tarjetas solo para grupos de campos. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --surface2:#F5F6F8; --ink:#121826; --ink2:#3B4458; --muted:#677087;
  --line:#D3D7E0; --line2:#E4E7ED;
  --accent:#1F4FA8; --accent-ink:#FFFFFF; --accent-s:#E3EAF8;
  --ok:#1E6E4C; --ok-s:#DDF0E6; --warn:#9A5A07; --warn-s:#F8EBD6; --bad:#A12E2E; --bad-s:#F7E1E1;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --ok:#6CC59B; --ok-s:#12291F; --warn:#E3A957; --warn-s:#33260F; --bad:#EC8A8A; --bad-s:#351B1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1017; --surface:#161B25; --surface2:#1C2230; --ink:#E7EAF1; --ink2:#B8BFCF; --muted:#8890A5;
  --line:#2C3345; --line2:#232A3A; --accent:#8FB0F5; --accent-ink:#0D1017; --accent-s:#1C2A47;
  --ok:#6CC59B; --ok-s:#12291F; --warn:#E3A957; --warn-s:#33260F; --bad:#EC8A8A; --bad-s:#351B1B; color-scheme:dark}

:root[data-night="1"]{
  --bg:#000000; --surface:#0B0303; --surface2:#140505; --ink:#D24A3A; --ink2:#B03A2E; --muted:#7E2C24;

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.bar .t{flex:1;min-width:0}
.bar .eyebrow{font:600 10.5px/1.2 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.bar h1{margin:2px 0 0;font:600 16px/1.25 var(--sans);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface2);border-radius:6px;min-width:40px;height:40px;padding:0 10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2)}
.iconbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

main{padding-top:16px;display:grid;gap:16px}

.note{border-left:3px solid var(--warn);background:var(--warn-s);padding:9px 12px;border-radius:0 6px 6px 0;font-size:13.5px;color:var(--ink)}
.note.info{border-color:var(--accent);background:var(--accent-s)}
.note.bad{border-color:var(--bad);background:var(--bad-s)}
.note.ok{border-color:var(--ok);background:var(--ok-s)}
.note b{font-weight:600}
.pill{display:inline-block;font:600 10.5px/1.6 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-s)}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-s)}
.pill.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-s)}
.pill.acc{color:var(--accent);border-color:var(--accent);background:var(--accent-s)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:0}

.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.zones{display:grid;gap:6px}
.zone{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13.5px;align-items:baseline}
.zone .pill{grid-row:span 2}
.zone small{color:var(--muted);grid-column:2}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:88px}
.thumb img{width:88px;height:88px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;background:var(--surface2)}
.thumb span{display:block;font:600 11px var(--mono);color:var(--ink2);margin-top:2px}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:13px;border:0;background:var(--surface);color:var(--bad);font-weight:700;cursor:pointer}
.addphoto{width:88px;height:88px;border:1.5px dashed var(--line);border-radius:6px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;background:var(--surface2);padding:4px}
.addphoto input{display:none}
.list{display:grid;gap:10px}
.insp{display:grid;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.insp b{color:var(--ink);font-size:15px}
.insp small{color:var(--muted)}
.check{display:grid;gap:6px}
.check li{font-size:14px}
ul.plain{margin:0;padding-left:18px;display:grid;gap:4px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.foot .in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.foot .st{flex:1;min-width:0;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled .seg button,fieldset:disabled .btn:not(.keep){opacity:.55}
.sample{border:1px dashed var(--warn);background:var(--warn-s);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sample b{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* ============ Utilidades ============ */

var LAY={ready:false,err:'',apb:null,recoge:null,astro50:null,sitios:null};
function decodeLayer(j){
  var feats=j.f.map(function(f){
    if(typeof f.g[0]==='number')return {p:f.p,pt:[f.g[0]/1e5,f.g[1]/1e5]};
    var polys=f.g.map(function(poly){return poly.map(function(r){var out=new Float64Array(r.length),x=0,y=0;for(var i=0;i<r.length;i+=2){x+=r[i];y+=r[i+1];out[i]=x/1e5;out[i+1]=y/1e5;}return out;});});
    var b=[180,90,-180,-90];
    polys.forEach(function(poly){var r=poly[0];for(var i=0;i<r.length;i+=2){if(r[i]<b[0])b[0]=r[i];if(r[i]>b[2])b[2]=r[i];if(r[i+1]<b[1])b[1]=r[i+1];if(r[i+1]>b[3])b[3]=r[i+1];}});
    return {p:f.p,polys:polys,bbox:b};
  });
  return {meta:j.meta,f:feats};
}
async function loadLayers(){
  try{
    var names=['apb','recoge','astro50','sitios'];
    var res=await Promise.all(names.map(function(n){return fetch('layers/'+n+'.lay.json').then(function(r){if(!r.ok)throw new Error(n+': HTTP '+r.status);return r.json();});}));
    names.forEach(function(n,i){LAY[n]=decodeLayer(res[i]);});
    /* La capa de sitios trae cada sitio dos veces: se deja uno por nombre y ubicación */
    var seen={};LAY.sitios.f=LAY.sitios.f.filter(function(f){var k=f.p.n+'|'+f.pt[0]+'|'+f.pt[1];if(seen[k])return false;seen[k]=1;return true;});
    LAY.ready=true;
  }catch(e){LAY.err=String(e&&e.message||e);}
}
function inRing(r,x,y){var c=false;for(var i=0,j=r.length-2;i<r.length;j=i,i+=2){var xi=r[i],yi=r[i+1],xj=r[j],yj=r[j+1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
function inFeat(f,x,y){if(x<f.bbox[0]||x>f.bbox[2]||y<f.bbox[1]||y>f.bbox[3])return false;var c=false;f.polys.forEach(function(poly){poly.forEach(function(r){if(inRing(r,x,y))c=!c;});});return c;}
function distEdge(f,lat,lon){
  var kx=111320*Math.cos(lat*Math.PI/180),ky=110574,best=Infinity;
  f.polys.forEach(function(poly){poly.forEach(function(r){
    for(var i=0;i<r.length-2;i+=2){
      var ax=(r[i]-lon)*kx,ay=(r[i+1]-lat)*ky,bx=(r[i+2]-lon)*kx,by=(r[i+3]-lat)*ky;
      var dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy,t=L?Math.max(0,Math.min(1,-(ax*dx+ay*dy)/L)):0;
      var px=ax+t*dx,py=ay+t*dy,d=px*px+py*py;if(d<best)best=d;
    }
  });});
  return Math.sqrt(best);
}
function nearBox(f,lat,lon,m){var dy=m/110574,dx=m/(111320*Math.cos(lat*Math.PI/180));return !(lon<f.bbox[0]-dx||lon>f.bbox[2]+dx||lat<f.bbox[1]-dy||lat>f.bbox[3]+dy);}
function zoneOf(lat,lon){
  var z={apb:[],recoge:[],astro50:[],near5:[],borde:[],sitio:null,sitios100:0,capas:{}};
  if(!LAY.ready)return null;
  ['apb','recoge','astro50'].forEach(function(k){z.capas[k]=LAY[k].meta.version;});
  LAY.apb.f.forEach(function(f){
    if(!nearBox(f,lat,lon,5000))return;
    var inside=inFeat(f,lon,lat),d=distEdge(f,lat,lon);
    var item={n:f.p.n,c:f.p.c,a:f.p.a||'',src:f.p.f||'',d:Math.round(d)};
    if(inside)z.apb.push(item);else if(d<=5000)z.near5.push(item);
    if(d<=100)z.borde.push(item);
  });
  LAY.recoge.f.forEach(function(f){if(nearBox(f,lat,lon,0)&&inFeat(f,lon,lat)){var d=distEdge(f,lat,lon);z.recoge.push({n:f.p.n,a:f.p.a,d:Math.round(d)});if(d<=100)z.borde.push({n:'Plan RECOGE '+f.p.n,c:'RECOGE',d:Math.round(d)});}});
  LAY.astro50.f.forEach(function(f){if(nearBox(f,lat,lon,0)&&inFeat(f,lon,lat))z.astro50.push({n:f.p.n,a:f.p.a});});
  var best=null;LAY.sitios.f.forEach(function(f){var d=hav(lat,lon,f.pt[1],f.pt[0]);if(d<=100000)z.sitios100++;if(!best||d<best.d)best={n:f.p.n,t:f.p.t,m:f.p.m,d:d};});
  if(best)z.sitio={n:best.n,t:best.t,m:best.m,km:Math.round(best.d/100)/10};
  var dedup={};z.apb=z.apb.filter(function(i){var k=i.c+'|'+i.n;if(dedup[k])return false;dedup[k]=1;return true;});
  dedup={};z.near5=z.near5.filter(function(i){var k=i.c+'|'+i.n;if(dedup[k])return false;dedup[k]=1;return true;}).sort(function(a,b){return a.d-b.d;});
  return z;
}

STORE.put=function(s,k,v){var self=this;self.mem[s][k]=v;return new Promise(function(res){if(!self.db)return res(false);try{var tx=self.db.transaction(s,'readwrite');tx.objectStore(s).put(v,k);tx.oncomplete=function(){res(true);};tx.onerror=function(){res(false);};}catch(e){res(false);}});};
STORE.del=function(s,k){var self=this;delete self.mem[s][k];return new Promise(function(res){if(!self.db)return res();try{var tx=self.db.transaction(s,'readwrite');tx.objectStore(s).delete(k);tx.oncomplete=function(){res();};tx.onerror=function(){res();};}catch(e){res();}});};

function need(I){
  var m={m0:[],m1:[],m2:[],m3:[],m4:[]},alerts=[];
  var p=I.prep,e=I.ejec,a=I.aplic;
  if(!p.uf)m.m0.push('Unidad fiscalizable');
  if(!p.titular)m.m0.push('Titular');
  if(!rutOk(p.rut))m.m0.push('RUT del titular válido');
  if(!p.domicilio)m.m0.push('Domicilio del titular para notificación');
  if(!p.motivo)m.m0.push('Motivo de la actividad');
  if(!(p.materias.length||p.materiaOtra))m.m0.push('Al menos una materia específica');
  if(!p.instrumentos.length)m.m0.push('Al menos un instrumento fiscalizado');
  if(!p.medira)m.m0.push('Indicar si habrá medición');
  if(p.medira==='si'){var q=p.equipo;['tipo','marca','modelo','serie','certN','certF'].forEach(function(k){if(!q[k])m.m0.push('Equipo de medición: '+{tipo:'tipo',marca:'marca',modelo:'modelo',serie:'N° de serie',certN:'N° de certificado de calibración',certF:'fecha del certificado de calibración'}[k]);});if(!q.fotos.length)m.m0.push('Foto del certificado de calibración');}
  if(!e.fecha)m.m1.push('Fecha de inspección');
  if(!e.hIni)m.m1.push('Hora de inicio');
  if(!e.estadoOp)m.m1.push('Estado operacional');
  if(!e.enc.nombre)m.m1.push('Encargado durante la inspección');
  [['oposicion','Oposición al ingreso'],['fuerza','Auxilio de la fuerza pública'],['colab','Colaboración'],['reunion','Reunión informativa']].forEach(function(x){if(!e[x[0]])m.m1.push(x[1]);});
  if(e.reunion==='si')['reuA','reuB','reuC','reuD'].forEach(function(k,i){if(!e[k])m.m1.push('Reunión informativa, literal '+'abcd'[i]+')');});
  if(e.reunion==='no'&&!e.reuCausa)m.m1.push('Causa de no realizar la reunión informativa');
  if(p.medira==='si'){if(!e.hEnc)m.m1.push('Hora de encendido del alumbrado público');if(!e.tIni||!e.humIni)m.m1.push('Temperatura y humedad al inicio');}
  if(!e.fisc.some(function(f){return f.nombre;}))m.m1.push('Fiscalizador encargado');
  if(!I.est.length)m.m2.push('Al menos una estación');
  I.est.forEach(function(s){
    if(s.lat==null)m.m2.push(s.id+': coordenadas');
    if(!s.n)m.m2.push(s.id+': nombre o descripción');
    if(s.acc!=null&&s.acc>20)alerts.push(s.id+': precisión del GPS de '+Math.round(s.acc)+' m (sobre 20 m).');
    if(s.manual&&s.lat!=null)alerts.push(s.id+': coordenadas ingresadas a mano; verifique contra la referencia del lugar.');
    if(s.zona&&s.zona.borde.length)alerts.push(s.id+': a menos de 100 m del límite de '+s.zona.borde.map(function(b){return b.n;}).join(', ')+'. Verificar con cartografía oficial.');
  });
  if(!a.fuente)m.m3.push('Fuente nueva o existente según el encargado');
  if(!a.finst&&!a.finstNI)m.m3.push('Fecha de instalación o "no informada"');
  if(!a.respaldo)m.m3.push('Respaldo de la fecha de instalación');
  if(a.respaldo==='foto'&&!a.respFotos.length)m.m3.push('Foto del respaldo de la fecha');
  var Z=zonesAll(I);
  if((Z.astro||Z.sitioCerca)&&!a.astroDecl)m.m3.push('Área Astronómica declarada: confirmar');
  if(Z.near5.length&&!a.ext5)m.m3.push('Extensión de 5 km: confirmar');
  Z.recoge.forEach(function(r){if(!a.recogeLuz[r])m.m3.push('Plan RECOGE '+r+': ¿identifica la luminosidad como amenaza?');});
  if(!I.lums.length)m.m4.push('Al menos un grupo de luminarias');
  I.lums.forEach(function(l){
    var id=l.id+': ';
    if(!l.tipo)m.m4.push(id+'tipo de alumbrado');
    if(!l.est)m.m4.push(id+'estación');
    if(!(+l.cant>0))m.m4.push(id+'cantidad');
    if(!l.lampara)m.m4.push(id+'tipo de lámpara');
    if(!l.certTipo)m.m4.push(id+'certificación');
    if(!l.c1i)m.m4.push(id+'instalación a la intemperie');
    if(!l.c1s)m.m4.push(id+'susceptibilidad de producir contaminación lumínica');
    ['marca','modelo','pot','finst','ubic','certN','certF'].forEach(function(k){if(!l[k]&&!(l.ni||{})[k])m.m4.push(id+{marca:'marca',modelo:'modelo',pot:'potencia',finst:'fecha de instalación',ubic:'ubicación',certN:'N° de certificado',certF:'fecha de certificación'}[k]+' o "no informado"');});
    if(l.tipo==='pub_luminoso'){if(!l.pubHoriz)m.m4.push(id+'orientación sobre la horizontal');if(!l.pubMorada)m.m4.push(id+'orientación hacia la morada');}
    else if(l.tipo==='canon'){if(!l.canon70)m.m4.push(id+'proyección sobre γ = 70°');}
    else if(l.tipo){if(!l.hemi)m.m4.push(id+'proyección al hemisferio superior');}
    if(!Object.keys(l.orient||{}).some(function(k){return l.orient[k];}))m.m4.push(id+'orientación del flujo');
    if(l.tipo==='ornamental'&&l.exDisp&&!l.exFlujo)m.m4.push(id+'flujo para la exención ornamental');
    if(!l.fotos.length)m.m4.push(id+'al menos una fotografía');
  });
  return {m:m,alerts:alerts,total:m.m0.length+m.m1.length+m.m2.length+m.m3.length+m.m4.length};
}
function zonesAll(I){
  var r={apb:[],recoge:[],astro:false,near5:[],sitioCerca:false};
  I.est.forEach(function(s){var z=s.zona;if(!z)return;
    z.apb.forEach(function(x){if(!r.apb.some(function(y){return y.n===x.n&&y.c===x.c;}))r.apb.push(x);});
    z.recoge.forEach(function(x){if(r.recoge.indexOf(x.n)<0)r.recoge.push(x.n);});
    z.near5.forEach(function(x){if(!r.near5.some(function(y){return y.n===x.n;}))r.near5.push(x);});
    if(z.astro50.length)r.astro=true;if(z.sitio&&z.sitio.km<=100)r.sitioCerca=true;});
  return r;
}
function docsAuto(I){
  var t={},L=I.lums,has=function(tp){return L.some(function(l){return tp.indexOf(l.tipo)>=0;});};
  t.d1=true;t.d3=true;t.d4=true;
  t.d2=L.some(function(l){return l.certTipo==='nc'||(l.ni||{}).certN||(l.ni||{}).certF;});
  t.d5=I.aplic.finstNI||I.aplic.respaldo==='acta'||L.some(function(l){return (l.ni||{}).finst;});
  t.d6=has(['ornamental','deportivo','pub_luminoso','pub_iluminado','industrial']);
  t.d7=has(['industrial']);t.d8=false;t.d9=has(['deportivo']);t.d10=has(['pub_luminoso']);t.d11=false;

async function addPhotos(files,refPath,ctx){
  var I=APP.I;if(!I||ro())return;
  for(var i=0;i<files.length;i++){
    var f=files[i];var buf=await f.arrayBuffer();var h=await sha256(buf);
    I.fotoSeq=(I.fotoSeq||0)+1;var id='F'+String(I.fotoSeq).padStart(3,'0');
    var rec={id:id,insp:I.id,type:f.type||'image/jpeg',name:f.name||'',size:f.size,hash:h,ts:stamp(),ctx:ctx||'',buf:buf};
    await STORE.put('photos',I.id+':'+id,rec);
    var arr=getP(I,refPath);arr.push({id:id,hash:h,ts:rec.ts,desc:''});
  }
  touch();render();
}
async function photoURL(I,id){
  var k=I.id+':'+id;if(APP.photoURL[k])return APP.photoURL[k];

}

    insp:{fecha:I.ejec.fecha,hora:I.ejec.hIni,temp:I.ejec.tIni,hum:I.ejec.humIni,protocolo:'',instr:[I.prep.equipo.tipo,I.prep.equipo.marca,I.prep.equipo.modelo].filter(Boolean).join(' '),serie:I.prep.equipo.serie,calib:'',cond:'',obs:''},

      if(l.tipo==='pub_luminoso'&&(l.pubHoriz==='si'||l.pubMorada==='si')){h.orient8='incumple';medio.orient8='acta';}
      if(l.tipo==='canon'&&l.canon70==='si'){h.g70='incumple';medio.g70='acta';}
      return {id:l.id,tipo:l.tipo,cant:+l.cant||0,marca:l.marca,modelo:l.modelo,pot:l.pot,tcc:l.tcc,flujo:l.flujo,foto:l.fotos.length?'Fot. '+photoRange(l.fotos):'',
        c1i:l.c1i,c1s:l.c1s,sinMuros:!!l.sinMuros,reorient:!!l.reorient,art4:l.art4,recambio:l.recambio==='nosabe'?'':l.recambio,frec:l.frec,tec:tec[l.lampara]||'',led532:'',
        certTipo:['aprobacion','seguimiento','tipo','sin'].indexOf(l.certTipo)>=0?l.certTipo:'',certN:l.certN,certF:l.certF,exDisp:l.exDisp,exFlujo:l.exFlujo,h:h,medio:medio,horExc:false,estServ:false,traza:'',valor:'',punto:'',extra:[]};}),

function p0(s){return String(s||'').slice(0,500);}
async function buildZip(I,final){
  var z=new JSZip(),man={},enc=new TextEncoder();
  async function add(path,data){z.file(path,data);var buf=typeof data==='string'?enc.encode(data):data instanceof Blob?await data.arrayBuffer():data;man[path]=await sha256(buf);}
  var photos=allPhotos(I),plist=[];
  for(var i=0;i<photos.length;i++){var ph=photos[i].p,r=await STORE.get('photos',I.id+':'+ph.id);if(!r)continue;var ext=(r.type.split('/')[1]||'jpg').replace('jpeg','jpg');var path='fotos/'+ph.id+'.'+ext;
    await add(path,r.buf);plist.push({id:ph.id,archivo:path,referencia:photos[i].ref,capturada:r.ts,sha256_captura:r.hash,nombre_original:r.name});}
  var N=need(I);
  var data=JSON.parse(JSON.stringify(I));data.exportado=stamp();data.final=!!final;data.pendientes=N;data.fotos=plist;
  await add('inspeccion.json',JSON.stringify(data,null,2));
  await add('revisor-ifa.json',JSON.stringify(revisorJSON(I),null,2));
  await add('acta-borrador.docx',await actaBlob(I));
  await add('LEEME.txt','Paquete de inspección lumínica · App de terreno '+APP_VER+'\r\nUnidad fiscalizable: '+I.prep.uf+'\r\nFecha: '+fmtD(I.ejec.fecha)+'\r\nEstado: '+(final?'cerrada':'borrador')+(I.cierre?' · hash del registro '+I.cierre.hash:'')+'\r\n\r\ninspeccion.json   Registro completo de terreno.\r\nrevisor-ifa.json  Archivo para "Abrir revisión" en el Revisor de IFA lumínicos de la DSC.\r\nacta-borrador.docx Borrador editable del acta.\r\nfotos/            Fotografías originales con sus metadatos.\r\nmanifiesto.json   SHA-256 de cada archivo del paquete.\r\n');
  z.file('manifiesto.json',JSON.stringify({generado:stamp(),app:APP_VER,reglas:RULES_VER,inspeccion:I.id,hash_registro:I.cierre?I.cierre.hash:null,archivos:man},null,2));
  return z.generateAsync({type:'blob',mimeType:'application/zip',compression:'DEFLATE',compressionOptions:{level:6}});
}
async function getDL(){if(!IN_ARTIFACT)return null;if(APP.dl!==undefined&&APP.dl!==null)return APP.dl;try{APP.dl=await window.claude.use('downloads');}catch(e){APP.dl=null;}return APP.dl;}
async function saveFile(name,blob){
  if(IN_ARTIFACT){var d=await getDL();if(!d){toast('La descarga no está disponible en esta vista.');return false;}
    try{await d.save({filename:name,data:blob});return true;}catch(e){toast(e&&e.code==='declined'?'Descarga cancelada.':e&&e.code==='rate_limited'?'Ya hay una descarga por confirmar.':'No se pudo descargar en esta vista.');return false;}}
  try{var file=new File([blob],name,{type:blob.type});
    if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true;}}catch(e){if(e&&e.name==='AbortError'){toast('Exportación cancelada.');return false;}}
  var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);return true;
}
function baseName(I){return slug(I.prep.uf)+'_'+(I.ejec.fecha||today());}
async function exportActa(){var I=APP.I;if(typeof JSZip==='undefined'){toast('No se cargó el generador de documentos. Conéctese una vez para cargarlo.');return;}
  toast('Generando acta…');var ok=await saveFile('acta_'+baseName(I)+'.docx',await actaBlob(I));if(ok){I.exportes.push({ts:stamp(),tipo:'acta .docx'});await saveNow();render(true);toast('Borrador de acta exportado.');}}
async function exportZip(final){var I=APP.I;if(typeof JSZip==='undefined'){toast('No se cargó el generador de paquetes. Conéctese una vez para cargarlo.');return false;}
  toast('Preparando paquete…');var blob=await buildZip(I,final);var ok=await saveFile('inspeccion_'+baseName(I)+(final?'_final':'_borrador')+'.zip',blob);
  if(ok){I.exportes.push({ts:stamp(),tipo:final?'paquete final .zip':'paquete borrador .zip'});await saveNow();render(true);if(!final)toast('Paquete exportado.');}return ok;}
async function closeInsp(b){
  var I=APP.I;if(!b.getAttribute('data-sure')){b.setAttribute('data-sure','1');b.textContent='Confirmar cierre';setTimeout(function(){if(b.isConnected){b.removeAttribute('data-sure');b.textContent='Cerrar y exportar paquete final';}},4500);return;}
  var prev={hFin:I.ejec.hFin};if(!I.ejec.hFin)I.ejec.hFin=nowHM();
  var snap=JSON.parse(JSON.stringify(I));delete snap.exportes;delete snap.mod;
  var h=await sha256(new TextEncoder().encode(JSON.stringify(snap)));
  I.estado='cerrada';I.cierre={ts:stamp(),hash:h};
  var ok=await exportZip(true);
  if(!ok){I.estado='abierta';I.cierre=null;I.ejec.hFin=prev.hFin;await saveNow();render(true);toast('El cierre requiere guardar el paquete final (R16). La inspección sigue abierta.');return;}
  await saveNow();render(true);toast('Inspección cerrada. Registro en solo lectura.');
}
